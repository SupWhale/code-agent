services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # 호스트에 포트를 게시하지 않음 — coding-agent가 도커 내부 DNS(ollama:11434)로만
    # 접근하면 충분하고, Ollama API는 자체 인증이 없어 게시 시 외부에서 모델을 직접
    # 호출할 수 있게 된다. 호스트에서 직접 확인이 필요하면
    # `docker compose exec ollama ollama list`처럼 컨테이너 안에서 실행할 것.
    volumes:
      - ./models:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - coding-agent-network

  coding-agent:
    # CI가 GHCR에 푸시한 태그를 pull하는 것이 기본 경로 (scripts/deploy_to_server.sh).
    # build:는 로컬에서 소스로 직접 빌드/테스트할 때를 위해 남겨둔다 (`docker compose build`).
    image: ghcr.io/supwhale/code-agent:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: coding-agent
    # 8000은 의도적으로 유지한다. scripts/deploy.sh는 DOMAIN이 없으면(LAN 테스트 배포)
    # nginx/certbot 자체를 안 띄우므로, 그 경우 8000 직접 접근이 API에 닿는 유일한
    # 경로다(실제로 지금 LAN 서버가 이 방식으로 운영 중). 원래는 nginx만 공개하고
    # 이 포트도 지우는 게 더 안전하지만(3.2절 참고), 그러려면 DOMAIN 없이도 nginx를
    # HTTP 전용으로 띄우도록 deploy.sh를 먼저 고쳐야 한다 — Phase 3(퍼블릭 도메인)
    # 전환 시 같이 정리할 것. docs/infrastructure.md 8장 참고.
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      # 에이전트가 실제 git 저장소를 직접 수정할 수 있도록 마운트 (셀프 리팩토링용).
      # SecurityValidator의 strict_mode 화이트리스트(src/tests/prompts/scripts)와
      # BLOCKED_PATHS(.git 등)가 그대로 적용되므로 워크스페이스 밖이나 .git은 못 건드림.
      # 필요 없을 땐 이 줄을 지우고 재배포하세요.
      - ..:/repo
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # SIGTERM 후 우아하게 종료할 시간 (uvicorn --timeout-graceful-shutdown 25s보다 여유 있게)
    stop_grace_period: 30s
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # 이전엔 하드코딩돼 있어서 .env의 MODEL_NAME을 바꿔도 컨테이너에 반영되지
      # 않는 버그가 있었다 — 이제 .env 값을 실제로 읽는다.
      - MODEL_NAME=${MODEL_NAME:-qwen2.5-coder:7b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - WORKSPACE_PATH=/workspace
      - MAX_FILE_SIZE=104857600
      # 공유 TaskManager/SessionManager 상태가 아직 프로세스 메모리에 있으므로
      # WORKERS>1은 워커 간 상태 불일치를 유발한다 (Phase 5에서 Redis 도입 후 상향)
      - WORKERS=1
      - ENVIRONMENT=production
      # 콤마 구분 "key:scope" 목록. .env에서 필수로 설정해야 하며 없으면 기동이 실패한다.
      - "API_KEYS=${API_KEYS:?API_KEYS가 .env 파일에 설정되어야 합니다. .env.example 참고}"
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENABLE_SHELL_TOOL=${ENABLE_SHELL_TOOL:-false}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - coding-agent-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      - "DOMAIN=${DOMAIN:?DOMAIN이 .env 파일에 설정되어야 합니다 (예: DOMAIN=agent.example.com). scripts/init_letsencrypt.sh 참고}"
    # nginx.conf.template의 ${DOMAIN}을 실제 값으로 치환한 뒤 기동
    command: sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - coding-agent
    restart: unless-stopped
    networks:
      - coding-agent-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 12시간마다 갱신 시도 (certbot이 만료 30일 이내인 인증서만 실제로 갱신함)
    entrypoint: "sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - coding-agent-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # 호스트에 포트를 게시하지 않음 — 운영 대시보드류는 nginx 뒤에 있지 않고 인증도
    # 없으므로, 호스트에 노출되면 방화벽 설정에만 의존하게 된다. 필요 시
    # `docker compose exec prometheus wget -qO- http://localhost:9090/-/healthy`처럼
    # 컨테이너 안에서 확인하거나, 확인 기간에만 한시적으로 ports를 되살릴 것.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    restart: unless-stopped
    networks:
      - coding-agent-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    # 호스트에 포트를 게시하지 않음 (prometheus와 동일한 이유 — 위 주석 참고)
    volumes:
      # deployment/alertmanager/alertmanager.yml.example를 복사해 웹훅 URL을 채우세요 (gitignore됨)
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks:
      - coding-agent-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    # 호스트에 포트를 게시하지 않음 (prometheus와 동일한 이유 — 위 주석 참고).
    # 호스트 파일시스템/도커 소켓을 read-only로 마운트하는 서비스라 더더욱 외부 노출을 피한다.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - coding-agent-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # 호스트에 포트를 게시하지 않음 (prometheus와 동일한 이유 — 위 주석 참고).
    # Grafana 자체 로그인은 있지만 이중 방어를 위해 여기서도 게시하지 않는다.
    # 대시보드를 브라우저로 봐야 하면 확인 기간에만 한시적으로 ports를 되살릴 것 —
    # 아래 GF_SERVER_ROOT_URL도 실제 접근 방식에 맞게 같이 바꿔야 한다.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 .env 파일에 설정되어야 합니다}"
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - coding-agent-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    # 호스트에 포트를 게시하지 않음 (prometheus와 동일한 이유 — 위 주석 참고)
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - coding-agent-network

volumes:
  prometheus-data:
  grafana-data:
  certbot-etc:
  certbot-webroot:
  alertmanager-data:

networks:
  coding-agent-network:
    driver: bridge
