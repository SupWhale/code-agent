services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - coding-agent-network

  coding-agent:
    # CI가 GHCR에 푸시한 태그를 pull하는 것이 기본 경로 (scripts/deploy_to_server.sh).
    # build:는 로컬에서 소스로 직접 빌드/테스트할 때를 위해 남겨둔다 (`docker compose build`).
    image: ghcr.io/supwhale/code-agent:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: coding-agent
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      # 에이전트가 실제 git 저장소를 직접 수정할 수 있도록 마운트 (셀프 리팩토링용).
      # SecurityValidator의 strict_mode 화이트리스트(src/tests/prompts/scripts)와
      # BLOCKED_PATHS(.git 등)가 그대로 적용되므로 워크스페이스 밖이나 .git은 못 건드림.
      # 필요 없을 땐 이 줄을 지우고 재배포하세요.
      - ..:/repo
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # SIGTERM 후 우아하게 종료할 시간 (uvicorn --timeout-graceful-shutdown 25s보다 여유 있게)
    stop_grace_period: 30s
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # 이전엔 하드코딩돼 있어서 .env의 MODEL_NAME을 바꿔도 컨테이너에 반영되지
      # 않는 버그가 있었다 — 이제 .env 값을 실제로 읽는다.
      - MODEL_NAME=${MODEL_NAME:-qwen2.5-coder:7b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - WORKSPACE_PATH=/workspace
      - MAX_FILE_SIZE=104857600
      # 공유 TaskManager/SessionManager 상태가 아직 프로세스 메모리에 있으므로
      # WORKERS>1은 워커 간 상태 불일치를 유발한다 (Phase 5에서 Redis 도입 후 상향)
      - WORKERS=1
      - ENVIRONMENT=production
      # 콤마 구분 "key:scope" 목록. .env에서 필수로 설정해야 하며 없으면 기동이 실패한다.
      - "API_KEYS=${API_KEYS:?API_KEYS가 .env 파일에 설정되어야 합니다. .env.example 참고}"
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENABLE_SHELL_TOOL=${ENABLE_SHELL_TOOL:-false}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - coding-agent-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      - "DOMAIN=${DOMAIN:?DOMAIN이 .env 파일에 설정되어야 합니다 (예: DOMAIN=agent.example.com). scripts/init_letsencrypt.sh 참고}"
    # nginx.conf.template의 ${DOMAIN}을 실제 값으로 치환한 뒤 기동
    command: sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - coding-agent
    restart: unless-stopped
    networks:
      - coding-agent-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 12시간마다 갱신 시도 (certbot이 만료 30일 이내인 인증서만 실제로 갱신함)
    entrypoint: "sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - coding-agent-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    restart: unless-stopped
    networks:
      - coding-agent-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      # deployment/alertmanager/alertmanager.yml.example를 복사해 웹훅 URL을 채우세요 (gitignore됨)
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks:
      - coding-agent-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - coding-agent-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 .env 파일에 설정되어야 합니다}"
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - coding-agent-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - coding-agent-network

volumes:
  prometheus-data:
  grafana-data:
  certbot-etc:
  certbot-webroot:
  alertmanager-data:

networks:
  coding-agent-network:
    driver: bridge
