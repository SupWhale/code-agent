apiVersion: 1

# 이미 만들어져 있던 (UID가 다른) 같은 이름의 데이터소스를 먼저 지운다.
# 기존 데이터소스의 UID를 프로비저닝으로 바꾸려고만 하면 Grafana가
# "Datasource provisioning error: data source not found"로 기동 자체에 실패한다
# (grafana-data 볼륨이 남아 있는 기존 배포에서 반드시 발생 — 2026-08-13 실제로 겪음).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid를 명시하지 않으면 Grafana가 임의의 UID(예: PBFA97CFB590B2093)를 붙이는데,
    # coding-agent.json의 패널들은 datasource를 uid "prometheus"로 참조한다.
    # 그 경우 UID가 어긋나 대시보드의 모든 패널이 "No data" + 쿼리 에러로 뜬다
    # (Prometheus 자체는 정상이라 원인이 잘 안 보인다 — 2026-08-13 실제로 겪음).
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
